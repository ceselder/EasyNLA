# DEFAULT RECIPE for the activation flow prior (GLP-style) on Qwen3.6-27B layer 42. Ablate against THIS file:
#   modal run --detach scripts/modal_glp.py --task pretrain --tag <name> --set "train.lr=1e-4 model.n_layers=12"
# Every run saves its resolved config to <out-dir>/config.yaml. Follows Luo et al. 2026 (GLP) unless noted.
base_id: Qwen/Qwen3.6-27B
layer: 42                      # activation = output of decoder block 42 (HF hidden_states[43]), same as the NLA AR/AV
gpus:
  producers: 4                 # GPUs streaming activations (LM truncated to 43 blocks); ~12.5k tok/s each (measured)
  consumers: 4                 # FSDP trainer GPUs
data:
  sources:                     # weighted mixture; chat sources are rendered with the Qwen chat template (so the prior covers chat-formatted + on-policy text)
    - {name: fineweb, kind: hf_text, dataset: HuggingFaceFW/fineweb, config: sample-10BT, weight: 0.85}
    - {name: wildchat_onpolicy, kind: chat_parquet, pattern: /vol_glp/data/wildchat_onpolicy_*.parquet, weight: 0.10}   # Qwen3.6-27B's own responses (vLLM, T=0.7)
    - {name: wildchat_original, kind: chat_parquet, pattern: /vol_glp/data/wildchat_original.parquet, weight: 0.05}     # WildChat's GPT responses
  attn_impl: sdpa              # HF attention kernel for the producer LM
  max_len: 2048                # docs truncated to this many tokens
  min_len: 16                  # shorter docs dropped
  tokens_per_batch: 32768      # padded tokens per LM forward (length-bucketed, right padding)
  buffer_docs: 512             # docs tokenised + sorted per bucket
  seed: 0                      # stream shuffle seed
  drop_pos0: true              # skip position 0 (attention-sink token), as GLP skips BOS
  max_tokens_per_producer: inf # cap per producer (smoke tests)
shards:
  size: 16384                  # activations per shard file
  max_ready: 48                # back-pressure: producers wait above this many unconsumed shards (~48 x 168 MB)
stats:
  n: 2000000                   # activations used for per-dim mean/var standardisation
  heldout_n: 65536             # held-out activations (never trained on)
  heldout_docs_full: 64        # held-out docs stored with token ids + all positions (for delta-LM-loss eval)
model:                         # GLP TransformerMLPDenoiser; d_model = 2 x d_act, d_mlp = 2 x d_model
  d_model: 10240
  d_mlp: 20480
  n_layers: 16                 # -> 13.7B params (GLP's largest was 6 blocks / 3.3B); deep so every block can later read the explanation
train:
  batch: 8192                  # per GPU -> global 32768 on 4 consumers = gradient noise scale B_noise measured on the pilot at 137M samples (33k; 5.2k at init). On B200:4 use 16384/GPU.
  lr: 5.0e-5                   # GLP value at batch 4096; the 3-point sweep at batch 32768 (1e-4 / 2e-4 / 4e-4, 60M samples each) picks the main-run value
  total_samples: 2.0e9         # single pass, no activation seen twice (2x GLP; ~14 h at 4:4). batch/lr to be set from the pilot's gradient-noise scale
  warmup: 0.01
  min_lr_frac: 0.1             # cosine floor
  clip: 1.0
  wd: 0.0
  ema: 0.9999
  compile: false
  fsdp: true                   # shard params/grads/Adam across consumer GPUs (needed above ~5B params)
eval:
  every: 2000                  # steps
  n: 32768                     # held-out activations scored (FD uses 16384 + reports the real-vs-real floor)
  sample_steps: 50             # Euler steps for FD samples
ckpt:
  every: 20000                 # steps -> latest/ (resumable, sharded DCP ~220 GB for 13.7B; ~10 min at 360 MB/s)
  snapshot_every_samples: 2.56e8   # full bf16 EMA snapshots (27 GB each)
max_hours: 22.3                # stop + save before Modal's 23 h limit; relaunch resumes from latest/
