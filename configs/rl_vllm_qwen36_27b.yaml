# NLA RL for Qwen3.6-27B on 6xB200 — nanoNLA/EasyNLA tuned defaults
# (configs/rl_vllm.yaml) with the minimum arch/memory-forced deviations:
#   batch_prompts 256 -> 252  (must divide by 6 DP ranks)
#   ar_lora on             (full-FT critic grads+Adam ~ +66GB: doesn't fit
#                            next to the 54GB actor + vLLM engine on 183GB)
#   vllm_model/base wrapper + qwen3_5_wrapper name map (vLLM registry has no
#                            text-only Qwen3_5ForCausalLM)
evals: [base_fve]
train_critic: true
ar_lora: true
ar_lora_r: 64
ar_lora_alpha: 16

lr: 1.0e-4
critic_lr: 8.0e-5
num_steps: 400
batch_prompts: 288        # 6×48; bumped from 252 for the 2k-step extension (peak mem set by micro-batch=4, not this)
group_size: 8
max_new_tokens: 256
length_penalty: 0.01
temperature: 1.0

lora_r: 128
lora_alpha: 16
use_rslora: true

vllm_tp: 1
vllm_max_len: 1024
vllm_gpu_mem: 0.35
ipc_weight_sync: true
vllm_name_map: qwen3_5_wrapper
vllm_attn_backend: FLASH_ATTN   # auto-picked FLASHINFER JIT-compiles (ninja/nvcc) and dies
# vllm_model set on CLI (absolute snapshot path of the base wrapper ckpt)

# 27B memory fit (per GPU: vLLM ~63GB + actor 51GB + critic 33GB): micro-batch 4
# (248k-vocab logits are ~2x Qwen3-8B's per token) + actor grad checkpointing.
logp_micro_batch: 4
critic_micro_batch: 4
gradient_checkpointing: true

eval_every: 10
eval_n_prompts: 128
save_every: 100
wandb_project: nla-qwen36-27b
wandb_name: rl_vllm
